<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Treino</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#05070b;
  --bg-2:#090d14;
  --card:#121823;
  --card-2:#171f2d;
  --card-3:#202a3a;
  --line:rgba(255,255,255,.09);
  --text:#f6f8ff;
  --muted:#8d98ab;
  --muted-2:#bac3d4;
  --green:#28f78f;
  --green-2:#0fd376;
  --blue:#28b7ff;
  --orange:#ff9447;
  --pink:#ff3f7f;
  --yellow:#ffd166;
  --shadow:0 24px 55px rgba(0,0,0,.38);
  --radius:26px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 16% -8%, rgba(40,247,143,.24), transparent 31%),
    radial-gradient(circle at 98% 12%, rgba(40,183,255,.18), transparent 28%),
    radial-gradient(circle at 52% 100%, rgba(255,63,127,.10), transparent 35%),
    linear-gradient(145deg, var(--bg), var(--bg-2) 52%, #06080e);
  color:var(--text);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), transparent 80%);
}

body::after{
  content:"";
  position:fixed;
  inset:-30%;
  z-index:-1;
  pointer-events:none;
  opacity:.38;
  background:conic-gradient(from 120deg, transparent, rgba(40,247,143,.12), transparent, rgba(40,183,255,.10), transparent);
  animation:slowSpin 18s linear infinite;
}

button,
a{
  touch-action:manipulation;
}

.app{
  width:min(900px,100%);
  margin:0 auto;
  padding:24px 18px 90px;
}

.header{
  padding:16px 0 22px;
}

.hero-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:32px;
  padding:28px 20px 20px;
  min-height:260px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025)),
    linear-gradient(160deg, rgba(18,24,35,.96), rgba(10,14,22,.92));
  box-shadow:var(--shadow);
}

.hero-card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-76px;
  top:-92px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(40,247,143,.50), transparent 64%);
  filter:blur(4px);
}

.hero-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,.10) 42%, transparent 62%);
  transform:translateX(-130%);
  animation:shine 7s ease-in-out infinite;
}

.hero-inner{
  position:relative;
  z-index:2;
  text-align:center;
}

.logo-icon{
  width:84px;
  height:84px;
  margin:0 auto 18px;
  border-radius:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(145deg, rgba(40,247,143,.24), rgba(40,183,255,.10));
  box-shadow:0 0 42px rgba(40,247,143,.26), inset 0 0 0 1px rgba(255,255,255,.12);
  animation:floatIcon 3.6s ease-in-out infinite;
}

.logo{
  font-size:clamp(46px, 10vw, 70px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:2px;
  line-height:.9;
  background:linear-gradient(90deg, #ffffff 0%, #dcffe9 42%, var(--green) 88%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 16px 38px rgba(40,247,143,.18);
}

.line{
  width:150px;
  height:7px;
  border-radius:999px;
  background:linear-gradient(90deg, var(--green), var(--blue));
  margin:14px auto;
  box-shadow:0 0 28px rgba(40,247,143,.35);
}

.subtitle{
  margin-top:12px;
  color:#d3d9e6;
  letter-spacing:4px;
  font-size:12px;
  font-weight:900;
}

.status-row{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:18px;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(40,247,143,.18);
  background:rgba(40,247,143,.08);
  color:#d8ffe9;
  padding:9px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.3px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px var(--green);
  animation:pulseDot 1.8s ease-in-out infinite;
}

.quick-stats{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-top:22px;
}

.stat-card{
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(12px);
  padding:13px 10px;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:1000;
  color:white;
}

.stat-label{
  margin-top:3px;
  color:var(--muted-2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.3px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:78px;
  margin:-8px -8px 20px;
  padding:8px;
  backdrop-filter:blur(20px);
  background:linear-gradient(180deg, rgba(5,7,11,.93), rgba(5,7,11,.68), rgba(5,7,11,0));
}

.back-btn{
  position:absolute;
  left:8px;
  width:50px;
  height:50px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;
  background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  color:white;
  font-size:30px;
  cursor:pointer;
  box-shadow:0 15px 35px rgba(0,0,0,.22);
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
}

.back-btn:active{
  transform:scale(.94);
}

.page-title{
  font-size:23px;
  font-weight:1000;
  letter-spacing:.2px;
  text-align:center;
}

.page-kicker{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:1.7px;
  font-weight:900;
}

.days-list{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
  margin-top:18px;
}

.day-card{
  width:100%;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  background:
    linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025)),
    linear-gradient(145deg, rgba(18,24,35,.98), rgba(13,18,27,.94));
  color:white;
  border-radius:var(--radius);
  padding:18px;
  min-height:116px;
  cursor:pointer;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  text-align:left;
  animation:fadeUp .62s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--delay,0ms);
  transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}

.day-card::before{
  content:"";
  position:absolute;
  inset:auto -80px -120px auto;
  width:220px;
  height:220px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(40,247,143,.17), transparent 65%);
  transition:transform .25s ease;
}

.day-card:active{
  transform:scale(.985) translateY(1px);
}

.day-card:hover{
  border-color:rgba(40,247,143,.22);
  box-shadow:0 28px 60px rgba(0,0,0,.34);
  transform:translateY(-2px);
}

.day-main{
  position:relative;
  display:flex;
  align-items:center;
  gap:16px;
  z-index:1;
}

.day-emoji{
  min-width:62px;
  height:62px;
  border-radius:20px;
  background:linear-gradient(145deg, rgba(40,247,143,.18), rgba(40,183,255,.08));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), 0 16px 28px rgba(0,0,0,.20);
}

.day-info{
  flex:1;
  min-width:0;
}

.day-name{
  font-size:20px;
  font-weight:1000;
  margin-bottom:6px;
}

.day-sub{
  color:#a8b2c4;
  font-size:14px;
  font-weight:800;
}

.day-mini{
  margin-top:8px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.mini-tag{
  color:#dfe7f7;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.075);
  border-radius:999px;
  padding:5px 8px;
  font-size:11px;
  font-weight:900;
}

.card-action{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.065);
  color:#c5cfdf;
  font-size:28px;
}

.progress-line{
  position:relative;
  z-index:1;
  height:5px;
  margin-top:18px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.progress-line span{
  display:block;
  height:100%;
  width:var(--progress,22%);
  border-radius:999px;
  background:linear-gradient(90deg, var(--green), var(--blue));
  box-shadow:0 0 18px rgba(40,247,143,.35);
  animation:growBar .85s ease both;
}

.section{
  position:relative;
  margin:22px 0 26px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  background:linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.020));
  box-shadow:0 20px 50px rgba(0,0,0,.22);
  overflow:hidden;
  animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--delay,0ms);
}

.section::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 0% 0%, rgba(40,183,255,.08), transparent 35%);
  pointer-events:none;
}

.section-head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:18px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.section-title{
  font-size:21px;
  font-weight:1000;
  color:#45baf2;
}

.section-title.aquecimento,
.section-title.warmup{
  color:var(--orange);
}

.section-title.skill{
  color:var(--green);
}

.section-title.wod{
  color:var(--pink);
}

.section-count{
  min-width:38px;
  height:30px;
  padding:0 11px;
  border-radius:999px;
  background:rgba(40,247,143,.12);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  border:1px solid rgba(40,247,143,.16);
}

.section-body{
  position:relative;
  z-index:1;
  padding:12px;
}

.exercise-card{
  width:100%;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(145deg, rgba(32,42,58,.86), rgba(19,26,38,.88));
  color:white;
  border-radius:21px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:10px;
  min-height:80px;
  cursor:pointer;
  text-align:left;
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
  animation:fadeUp .52s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--delay,0ms);
}

.exercise-card:last-child{
  margin-bottom:0;
}

.exercise-card:hover{
  border-color:rgba(40,247,143,.18);
  transform:translateY(-1px);
}

.exercise-card:active{
  transform:scale(.985);
}

.thumb{
  min-width:54px;
  height:54px;
  border-radius:18px;
  background:linear-gradient(145deg, rgba(0,0,0,.9), rgba(12,17,25,.85));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:var(--green);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 12px 24px rgba(0,0,0,.22);
}

.exercise-index{
  color:var(--muted);
  font-size:12px;
  font-weight:1000;
  letter-spacing:.8px;
  margin-bottom:3px;
}

.exercise-name{
  flex:1;
  font-size:16.5px;
  font-weight:950;
  line-height:1.25;
}

.exercise-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:#b3bdd0;
  font-size:12.5px;
  margin-top:7px;
  font-weight:760;
}

.meta-pill{
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
}

.arrow{
  color:#858d9b;
  font-size:28px;
}

.empty{
  margin-top:22px;
  background:linear-gradient(145deg, rgba(18,24,35,.95), rgba(12,17,26,.90));
  color:#aeb6c4;
  border-radius:24px;
  padding:24px;
  font-size:16px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  animation:fadeUp .55s ease both;
}

.loading{
  position:relative;
  overflow:hidden;
}

.loading::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.08), transparent);
  transform:translateX(-100%);
  animation:skeleton 1.5s infinite;
}

.video-wrap{
  position:relative;
  margin:20px auto 22px;
  max-width:620px;
  border-radius:28px;
  overflow:hidden;
  background:#05070b;
  box-shadow:0 28px 68px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both;
}

.video-wrap::before{
  content:"";
  position:absolute;
  inset:-1px;
  z-index:0;
  background:linear-gradient(135deg, rgba(40,247,143,.45), rgba(40,183,255,.28), rgba(255,63,127,.22));
  opacity:.22;
}

.video-box{
  position:relative;
  z-index:1;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  margin:1px;
  width:calc(100% - 2px);
  border-radius:27px;
  overflow:hidden;
}

.video-box iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.exercise-nav{
  max-width:620px;
  margin:10px auto 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  animation:fadeUp .55s ease both;
  animation-delay:90ms;
}

.exercise-nav button{
  width:52px;
  height:52px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  color:white;
  font-size:26px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 18px 34px rgba(0,0,0,.28);
  transition:transform .18s ease, border-color .18s ease;
}

.exercise-nav button:active{
  transform:scale(.94);
}

.exercise-nav span{
  min-width:74px;
  text-align:center;
  color:var(--green);
  font-size:14px;
  font-weight:1000;
  border:1px solid rgba(40,247,143,.16);
  background:rgba(40,247,143,.08);
  border-radius:999px;
  padding:10px 12px;
}

.detail-card{
  max-width:620px;
  margin:0 auto;
  text-align:center;
  border:1px solid rgba(255,255,255,.09);
  border-radius:30px;
  background:linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  box-shadow:0 22px 52px rgba(0,0,0,.26);
  padding:22px 18px 24px;
  animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:130ms;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:1000;
  background:rgba(40,183,255,.11);
  color:#bdeaff;
  border:1px solid rgba(40,183,255,.16);
  margin-bottom:17px;
}

.detail-title{
  font-size:clamp(24px, 6vw, 34px);
  font-weight:1000;
  letter-spacing:-.4px;
  margin-bottom:16px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:14px;
}

.detail-info{
  color:#c4ccdb;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  padding:13px 14px;
  line-height:1.45;
  text-align:center;
  font-weight:650;
}

.video-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:18px;
  background:linear-gradient(90deg, var(--green), #57ffb1);
  color:#02150c;
  text-decoration:none;
  padding:15px 20px;
  border-radius:999px;
  font-weight:1000;
  box-shadow:0 0 26px rgba(40,247,143,.26);
  transition:transform .18s ease, box-shadow .18s ease;
}

.video-link:active{
  transform:scale(.97);
}

.hidden{
  display:none!important;
}

.view-animate{
  animation:pageIn .35s ease both;
}

@keyframes pageIn{
  from{opacity:0; transform:translateY(10px) scale(.992)}
  to{opacity:1; transform:translateY(0) scale(1)}
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(18px)}
  to{opacity:1; transform:translateY(0)}
}

@keyframes floatIcon{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-8px) rotate(2deg)}
}

@keyframes pulseDot{
  0%,100%{transform:scale(1); opacity:1}
  50%{transform:scale(1.65); opacity:.55}
}

@keyframes shine{
  0%,60%{transform:translateX(-130%)}
  78%,100%{transform:translateX(130%)}
}

@keyframes growBar{
  from{transform:scaleX(0); transform-origin:left}
  to{transform:scaleX(1); transform-origin:left}
}

@keyframes skeleton{
  to{transform:translateX(100%)}
}

@keyframes slowSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

@media(min-width:760px){
  .days-list{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .info-grid{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .detail-info.full{
    grid-column:1/-1;
  }
}

@media(max-width:640px){
  .app{
    padding:18px 14px 78px;
  }

  .hero-card{
    border-radius:28px;
    padding:24px 16px 18px;
    min-height:248px;
  }

  .logo-icon{
    width:76px;
    height:76px;
    border-radius:23px;
  }

  .subtitle{
    font-size:10.5px;
    letter-spacing:2.6px;
  }

  .quick-stats{
    gap:8px;
  }

  .stat-card{
    padding:11px 6px;
    border-radius:17px;
  }

  .stat-number{
    font-size:18px;
  }

  .stat-label{
    font-size:9.5px;
  }

  .day-card{
    min-height:108px;
    border-radius:24px;
    padding:16px;
  }

  .day-emoji{
    min-width:56px;
    height:56px;
    border-radius:18px;
  }

  .day-name{
    font-size:18px;
  }

  .section-title{
    font-size:19px;
  }

  .exercise-name{
    font-size:15.5px;
  }
}

@media(prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="app">

  <div id="homeView">
    <div class="header">
      <div class="hero-card">
        <div class="hero-inner">
          <div class="logo-icon">🏋️</div>
          <div class="logo">TREINO</div>
          <div class="line"></div>
          <div class="subtitle">TREINO • PERFORMANCE • EVOLUÇÃO</div>

          <div class="status-row">
            <div class="status-pill" id="syncStatus"><span class="status-dot"></span> Preparando app</div>
          </div>
        </div>

        <div class="quick-stats">
          <div class="stat-card">
            <div class="stat-number" id="totalTreinos">0</div>
            <div class="stat-label">TREINOS</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="totalVideos">0</div>
            <div class="stat-label">VÍDEOS</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="lastSync">--</div>
            <div class="stat-label">ATUALIZADO</div>
          </div>
        </div>
      </div>
    </div>

    <div class="days-list" id="daysList"></div>
  </div>

  <div id="dayView" class="hidden">
    <div class="topbar">
      <button class="back-btn" onclick="voltarHome()" aria-label="Voltar para início">‹</button>
      <div>
        <div class="page-kicker">Treinos da semana</div>
        <div class="page-title" id="dayTitle"></div>
      </div>
    </div>

    <div id="dayContent"></div>
  </div>

  <div id="exerciseView" class="hidden">
    <div class="topbar">
      <button class="back-btn" onclick="voltarDia()" aria-label="Voltar para o dia">‹</button>
      <div>
        <div class="page-kicker">Exercício</div>
        <div id="exerciseCounter" style="color:#28f78f;font-size:14px;font-weight:1000;text-align:center;margin-top:4px;"></div>
      </div>
    </div>

    <div id="exerciseContent"></div>
  </div>

</div>

<script>
const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTxxcHY_9_SE0TZy40I7dG1bfYfns65q7VdJF-Bm7vK5RhGTe8R_ZIkcL2hwAKyTNuuSCbkF1bwgmL4Pjr26HoaXBVdOezm16KEEjXdxoYe0gpy5nosPRSc6fB4NbE0vUnPxJFJqt7BePJ9wMa73ACkbpFl7n0R2OSTiyO44n0HfQCqghpnvjPsGlkPmNhcMNk_heWopRjqwF7e__NB-tB5-D13cD6g2iDvlj_R1YeSyVM3dnqZZIhghl_GMpySZ9_cxRIcHpi_Z-4ZtyhQBasX6WysTA&lib=MugMYOnr_k_7GWZLjrOLbJyIO1ye3IR6Q";

const dias = [
  {key:"Segunda", label:"Segunda-feira", emoji:"💪"},
  {key:"Terça", label:"Terça-feira", emoji:"🔥"},
  {key:"Quarta", label:"Quarta-feira", emoji:"⚡"},
  {key:"Quinta", label:"Quinta-feira", emoji:"🏆"},
  {key:"Sexta", label:"Sexta-feira", emoji:"💥"},
  {key:"Sábado", label:"Sábado", emoji:"🎯"}
];

let treinos = [];
let diaAtual = "Segunda";
let listaAtual = [];
let exercicioAtual = 0;

const CACHE_TREINOS = "meu_treino_cache_v1";
const CACHE_DATA = "meu_treino_cache_data_v1";
const ROTA_PADRAO = "home";
let carregandoTreinos = false;

function escapeHtml(valor){
  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function rotaAtual(){
  const hash = window.location.hash.replace("#", "");
  if(!hash) return { view: ROTA_PADRAO };

  const params = new URLSearchParams(hash);
  return {
    view: params.get("view") || ROTA_PADRAO,
    dia: params.get("dia") || "Segunda",
    index: Number(params.get("index") || 0)
  };
}

function atualizarRota(view, dados = {}){
  const url = new URL(window.location.href);

  if(view === "home"){
    url.hash = "";
  }else{
    const params = new URLSearchParams();
    params.set("view", view);
    if(dados.dia) params.set("dia", dados.dia);
    if(dados.index !== undefined) params.set("index", dados.index);
    url.hash = params.toString();
  }

  history.replaceState(null, "", url.pathname + url.search + url.hash);
}

function restaurarRota(){
  const rota = rotaAtual();

  if(rota.view === "dia"){
    abrirDia(rota.dia || diaAtual, false);
    return;
  }

  if(rota.view === "exercicio"){
    const dia = rota.dia || diaAtual;
    abrirDia(dia, false);

    if(listaAtual.length){
      const indexSeguro = Number.isFinite(rota.index)
        ? Math.max(0, Math.min(rota.index, listaAtual.length - 1))
        : 0;
      abrirExercicio(indexSeguro, false);
    }
    return;
  }

  mostrar("homeView");
}

function salvarTreinosNoCache(data){
  try{
    if(!Array.isArray(data)) return;
    localStorage.setItem(CACHE_TREINOS, JSON.stringify(data));
    localStorage.setItem(CACHE_DATA, new Date().toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}));
  }catch(e){}
}

function carregarTreinosDoCache(){
  try{
    const salvo = localStorage.getItem(CACHE_TREINOS);
    if(!salvo) return false;

    const data = JSON.parse(salvo);
    if(!Array.isArray(data)) return false;

    treinos = data;
    renderDias();
    return true;
  }catch(e){
    return false;
  }
}

function normalizarTexto(texto){
  return String(texto || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function limparLink(link){
  const url = String(link || "").trim();
  if(!url) return "";
  if(url.startsWith("http://") || url.startsWith("https://")) return url;
  return "https://" + url;
}

function pegarCampo(obj, nomes){
  for(const nome of nomes){
    if(obj && obj[nome] !== undefined && obj[nome] !== null && String(obj[nome]).trim() !== ""){
      return obj[nome];
    }
  }

  const chaves = Object.keys(obj || {});
  for(const nome of nomes){
    const alvo = normalizarTexto(nome);
    const chave = chaves.find(k => normalizarTexto(k) === alvo);
    if(chave && obj[chave] !== undefined && obj[chave] !== null && String(obj[chave]).trim() !== ""){
      return obj[chave];
    }
  }

  return "";
}

function linkVideo(treino){
  return limparLink(pegarCampo(treino, ["YouTube", "Youtube", "youtube", "Video", "Vídeo", "video", "Link", "link"]));
}

function youtubeEmbed(url){
  const link = limparLink(url);
  if(!link) return "";

  let id = "";

  try{
    const u = new URL(link);

    if(u.hostname.includes("youtu.be")){
      id = u.pathname.replace("/", "");
    }

    if(u.hostname.includes("youtube.com")){
      if(u.pathname.includes("/shorts/")){
        id = u.pathname.split("/shorts/")[1].split("/")[0];
      }else if(u.searchParams.get("v")){
        id = u.searchParams.get("v");
      }
    }
  }catch(e){}

  if(!id) return "";

  return "https://www.youtube.com/embed/" + id + "?mute=1&playsinline=1&rel=0&modestbranding=1";
}

function secaoClasse(secao){
  const s = normalizarTexto(secao);
  if(s.includes("aquecimento")) return "aquecimento";
  if(s.includes("warm")) return "warmup";
  if(s.includes("skill") || s.includes("habilidade")) return "skill";
  if(s.includes("wod")) return "wod";
  if(s.includes("along")) return "alongamento";
  return "alongamento";
}

function secaoEmoji(secao){
  const s = normalizarTexto(secao);
  if(s.includes("along")) return "🧘";
  if(s.includes("aquecimento")) return "🔥";
  if(s.includes("warm")) return "🔥";
  if(s.includes("skill") || s.includes("habilidade")) return "🎯";
  if(s.includes("wod")) return "🏋️";
  return "💪";
}

function atualizarStatus(texto){
  const status = document.getElementById("syncStatus");
  if(status){
    status.innerHTML = `<span class="status-dot"></span> ${escapeHtml(texto)}`;
  }
}

function atualizarResumo(){
  const totalTreinos = document.getElementById("totalTreinos");
  const totalVideos = document.getElementById("totalVideos");
  const lastSync = document.getElementById("lastSync");
  const cacheData = localStorage.getItem(CACHE_DATA) || "--";

  if(totalTreinos) totalTreinos.textContent = String(treinos.length);
  if(totalVideos) totalVideos.textContent = String(treinos.filter(t => linkVideo(t)).length);
  if(lastSync) lastSync.textContent = cacheData;
}

function mostrar(view){
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("exerciseView").classList.add("hidden");

  const tela = document.getElementById(view);
  tela.classList.remove("hidden");
  tela.classList.remove("view-animate");
  void tela.offsetWidth;
  tela.classList.add("view-animate");
  window.scrollTo(0,0);
}

async function carregar(){
  renderDias();

  const carregouCache = carregarTreinosDoCache();

  if(carregouCache){
    atualizarStatus("Treinos carregados rápido");
    restaurarRota();
  }else{
    atualizarStatus("Sincronizando planilha");
    document.getElementById("daysList").innerHTML =
      '<div class="empty loading">Carregando treinos da planilha...</div>';
  }

  if(carregandoTreinos) return;
  carregandoTreinos = true;

  try{
    const separador = API_URL.includes("?") ? "&" : "?";
    const urlAtualizada = API_URL + separador + "_atualizar=" + Date.now();

    const res = await fetch(urlAtualizada, {
      cache: "no-store",
      headers: {
        "Accept": "application/json"
      }
    });

    if(!res.ok){
      throw new Error("Erro ao buscar planilha");
    }

    const data = await res.json();

    treinos = Array.isArray(data) ? data : [];
    salvarTreinosNoCache(treinos);
    renderDias();
    atualizarStatus("Planilha sincronizada");
    restaurarRota();

  }catch(err){
    console.error(err);
    atualizarStatus(carregouCache ? "Usando dados salvos" : "Erro na sincronização");

    if(!carregouCache){
      document.getElementById("daysList").innerHTML =
        '<div class="empty">Erro ao carregar os treinos da planilha.</div>';
    }
  }finally{
    carregandoTreinos = false;
  }
}

function renderDias(){
  const area = document.getElementById("daysList");
  atualizarResumo();

  const maiorQtd = Math.max(1, ...dias.map(dia => treinos.filter(t => normalizarTexto(t.Dia) === normalizarTexto(dia.key)).length));

  area.innerHTML = dias.map((dia, i) => {
    const treinosDoDia = treinos.filter(t => normalizarTexto(t.Dia) === normalizarTexto(dia.key));
    const qtd = treinosDoDia.length;
    const texto = qtd > 0 ? `${qtd} treino${qtd > 1 ? "s" : ""} disponível${qtd > 1 ? "s" : ""}` : "Toque para ver o treino";
    const secoes = [...new Set(treinosDoDia.map(t => String(t.Secao || "Treino").trim()).filter(Boolean))].slice(0,3);
    const progresso = Math.max(18, Math.round((qtd / maiorQtd) * 100));

    return `
      <button class="day-card" style="--delay:${i * 65}ms; --progress:${progresso}%" onclick="abrirDia('${dia.key}')">
        <div class="day-main">
          <div class="day-emoji">${dia.emoji}</div>
          <div class="day-info">
            <div class="day-name">${escapeHtml(dia.label)}</div>
            <div class="day-sub">${escapeHtml(texto)}</div>
            <div class="day-mini">
              ${secoes.length ? secoes.map(s => `<span class="mini-tag">${escapeHtml(s)}</span>`).join("") : '<span class="mini-tag">Semana</span>'}
            </div>
          </div>
          <div class="card-action">›</div>
        </div>
        <div class="progress-line"><span></span></div>
      </button>
    `;
  }).join("");
}

function abrirDia(dia, salvarNaRota = true){
  diaAtual = dia;
  if(salvarNaRota) atualizarRota("dia", { dia });
  const config = dias.find(d => normalizarTexto(d.key) === normalizarTexto(dia));
  document.getElementById("dayTitle").innerHTML = `${config ? config.emoji : "💪"} ${escapeHtml(config ? config.label : dia)}`;

  listaAtual = treinos.filter(t => normalizarTexto(t.Dia) === normalizarTexto(diaAtual));

  const area = document.getElementById("dayContent");

  if(listaAtual.length === 0){
    area.innerHTML = '<div class="empty">Nenhum treino encontrado para este dia.</div>';
    mostrar("dayView");
    return;
  }

  const grupos = {};
  listaAtual.forEach((t, index) => {
    const secao = String(t.Secao || "Treino").trim();
    if(!grupos[secao]) grupos[secao] = [];
    grupos[secao].push({...t, originalIndex:index});
  });

  area.innerHTML = Object.keys(grupos).map((secao, sectionIndex) => {
    const classe = secaoClasse(secao);
    const emoji = secaoEmoji(secao);

    const itens = grupos[secao].map((item, itemIndex) => {
      const tempo = item.Tempo ? `<span class="meta-pill">⏱ ${escapeHtml(item.Tempo)}</span>` : "";
      const carga = item.Carga ? `<span class="meta-pill">🏋️ ${escapeHtml(item.Carga)}</span>` : "";
      const video = linkVideo(item) ? `<span class="meta-pill">▶ Vídeo</span>` : "";
      return `
        <button class="exercise-card" style="--delay:${(sectionIndex * 80) + (itemIndex * 42)}ms" onclick="abrirExercicio(${item.originalIndex})">
          <div class="thumb">${linkVideo(item) ? "▶" : secaoEmoji(secao)}</div>
          <div style="flex:1;min-width:0;">
            <div class="exercise-index">#${String(item.originalIndex + 1).padStart(2,"0")}</div>
            <div class="exercise-name">${escapeHtml(item.Treino || "Treino")}</div>
            <div class="exercise-meta">${tempo}${carga}${video}</div>
          </div>
          <div class="arrow">›</div>
        </button>
      `;
    }).join("");

    return `
      <div class="section" style="--delay:${sectionIndex * 70}ms">
        <div class="section-head">
          <div class="section-title ${classe}">${emoji} ${escapeHtml(secao)}</div>
          <div class="section-count">${grupos[secao].length}</div>
        </div>
        <div class="section-body">
          ${itens}
        </div>
      </div>
    `;
  }).join("");

  mostrar("dayView");
}

function abrirExercicio(index, salvarNaRota = true){
  exercicioAtual = index;

  const treino = listaAtual[exercicioAtual];
  if(!treino) return;

  if(salvarNaRota) atualizarRota("exercicio", { dia: diaAtual, index: exercicioAtual });

  const link = linkVideo(treino);
  const embed = youtubeEmbed(link);
  const secao = treino.Secao || treino.Seção || "Treino";
  const emoji = secaoEmoji(secao);

  document.getElementById("exerciseCounter").textContent = `${exercicioAtual + 1} / ${listaAtual.length}`;

  const infoTempo = treino.Tempo ? `<div class="detail-info">⏱ <strong>Tempo</strong><br>${escapeHtml(treino.Tempo)}</div>` : "";
  const infoCarga = treino.Carga ? `<div class="detail-info">🏋️ <strong>Carga</strong><br>${escapeHtml(treino.Carga)}</div>` : "";
  const infoTexto = treino.Informacoes ? `<div class="detail-info full">📝 ${escapeHtml(treino.Informacoes)}</div>` : "";

  document.getElementById("exerciseContent").innerHTML = `
    <div class="video-wrap">
      <div class="video-box">
        ${
          embed
          ? `<iframe src="${embed}" title="Vídeo do treino sem áudio" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`
          : `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#b9c7dd;padding:20px;text-align:center;font-weight:800;">Sem vídeo cadastrado</div>`
        }
      </div>
    </div>

    <div class="exercise-nav">
      <button onclick="treinoAnterior()" aria-label="Treino anterior">‹</button>
      <span>${exercicioAtual + 1} / ${listaAtual.length}</span>
      <button onclick="proximoTreino()" aria-label="Próximo treino">›</button>
    </div>

    <div class="detail-card">
      <div class="badge">${emoji} ${escapeHtml(secao)}</div>
      <div class="detail-title">${escapeHtml(treino.Treino || "Treino")}</div>

      <div class="info-grid">
        ${infoTempo}${infoCarga}${infoTexto}
      </div>

      ${link ? `<a class="video-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">▶ Assistir no YouTube</a>` : ""}
    </div>
  `;

  mostrar("exerciseView");
}

function proximoTreino(){
  if(!listaAtual.length) return;
  const proximo = exercicioAtual >= listaAtual.length - 1 ? 0 : exercicioAtual + 1;
  abrirExercicio(proximo);
}

function treinoAnterior(){
  if(!listaAtual.length) return;
  const anterior = exercicioAtual <= 0 ? listaAtual.length - 1 : exercicioAtual - 1;
  abrirExercicio(anterior);
}

let toqueInicioX = 0;

document.addEventListener("touchstart", function(e){
  if(document.getElementById("exerciseView").classList.contains("hidden")) return;
  toqueInicioX = e.changedTouches[0].screenX;
}, {passive:true});

document.addEventListener("touchend", function(e){
  if(document.getElementById("exerciseView").classList.contains("hidden")) return;
  const toqueFimX = e.changedTouches[0].screenX;
  const diferenca = toqueFimX - toqueInicioX;

  if(Math.abs(diferenca) > 60){
    if(diferenca < 0){
      proximoTreino();
    }else{
      treinoAnterior();
    }
  }
}, {passive:true});

function voltarHome(){
  atualizarRota("home");
  mostrar("homeView");
}

function voltarDia(){
  abrirDia(diaAtual);
}

window.addEventListener("hashchange", function(){
  if(treinos.length) restaurarRota();
});

carregar();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(reg => {
      if(reg && reg.update) reg.update();
    })
    .catch(err => console.error("Erro no service worker:", err));
}
</script>
