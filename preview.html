<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu App Treino Completo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#050816;color:#fff;padding:18px}
.container{max-width:1050px;margin:auto}
header{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;position:sticky;top:0;background:#050816;padding:12px 0;z-index:10}
.tab{padding:14px 22px;border-radius:16px;background:#151b2b;border:1px solid rgba(255,255,255,.08);cursor:pointer;font-weight:700}
.tab.active{background:linear-gradient(90deg,#7b4dff,#00c2ff)}
.screen{display:none}.screen.active{display:block}
.card{background:linear-gradient(180deg,#1a2032,#111624);padding:24px;border-radius:28px;border:1px solid rgba(255,255,255,.08);margin-bottom:22px}
h1{font-size:24px;margin-bottom:8px}.subtitle{color:#aab2c5;margin-bottom:20px}
.row{display:flex;gap:12px;flex-wrap:wrap}
input,select,textarea{background:#202637;border:1px solid rgba(255,255,255,.06);padding:14px;border-radius:14px;color:white;font-size:14px}
input,textarea{flex:1}button{border:none;padding:14px 18px;border-radius:14px;font-weight:700;cursor:pointer;color:white}
.primary{background:linear-gradient(90deg,#7b4dff,#00c2ff)}.danger{background:#ff334f}.success{background:#22c55e;color:#06100a}
.list-item,.history-item{background:#202637;padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.history-item{display:block}.history-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.history-edit-box{display:grid;gap:10px;margin-top:12px}.history-edit-box select,.history-edit-box input{width:100%}
.tag{display:inline-block;padding:6px 10px;background:#7b4dff;border-radius:10px;font-size:12px;margin-left:8px}small{color:#9ba3ba}

/* Crossfit visualização / edição */
.cross-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.cross-day-title{font-size:26px;font-weight:800}
.mode-btn{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;cursor:pointer}
.edit-btn{background:#151b2b;color:#fff;border:2px solid #fff}.save-btn{background:#18f57d;color:#04120a}
.day-tabs{display:flex;gap:10px;overflow:auto;margin-bottom:20px;padding-bottom:4px}
.day-tab{white-space:nowrap;padding:12px 16px;border-radius:14px;background:#151b2b;cursor:pointer;border:1px solid rgba(255,255,255,.07)}
.day-tab.active{background:#1dff83;color:#06100a;font-weight:800}
.mode-label{font-size:13px;color:#94a3b8;margin-bottom:20px}
.cross-section{margin-bottom:34px}
.cross-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.cross-section-title{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:800}
.cross-section-title input{font-size:20px;font-weight:800}
.time-pill{background:#0e2f1e;color:#18f57d;padding:8px 14px;border-radius:14px;font-weight:700}
.cross-line{height:1px;background:rgba(255,255,255,.1);margin:14px 0 18px}
.exercise-card-view{background:linear-gradient(90deg,#202636,#2a3144);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.exercise-left{display:flex;align-items:center;gap:16px}.exercise-icon{background:#121826;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}.arrow{opacity:.5;font-size:24px}
.exercise-info{margin-top:6px;color:#9ba3ba;font-size:13px;line-height:1.4}
.exercise-info-bar{display:grid;grid-template-columns:1.2fr 1.5fr .9fr 1.2fr;gap:8px;margin:8px 0 14px;color:#94a3b8;font-size:12px}
.exercise-info-bar span{background:#111827;border-radius:10px;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-card{background:#1f2637;padding:18px;border-radius:20px;margin-bottom:16px;position:relative}
.circle-delete{background:#ff3131;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.delete-abs{position:absolute;right:12px;top:12px}
.youtube-box{background:#111827;padding:12px 16px;border-radius:12px;border:2px solid #ff0000;color:#fff;display:inline-block;margin:10px 0}
.add-btn{width:100%;padding:16px;border-radius:16px;background:transparent;border:1px dashed rgba(255,255,255,.15);color:#cbd5e1;margin-top:12px;cursor:pointer}
iframe{width:100%;height:230px;border:none;border-radius:14px;margin:8px 0 18px}

/* Treino */
.person-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.person-btn{padding:12px 18px;background:#202637;border-radius:12px;cursor:pointer}.person-btn.active{background:linear-gradient(90deg,#7b4dff,#00c2ff)}
.exercise{background:#141a29;padding:11px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.category-title-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.category-title-row input{max-width:220px;font-size:18px;font-weight:800}
.category-actions{display:flex;gap:8px;flex-wrap:wrap}
.add-category-box{margin-bottom:20px}
@media(max-width:620px){body{padding:10px}.card{padding:16px;border-radius:22px}.cross-section-header{align-items:flex-start;flex-direction:column}iframe{height:200px}.exercise-info-bar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="tab active" onclick="showScreen('inicio',this)">Início</div>
<div class="tab" onclick="showScreen('crossfit',this)">Crossfit</div>
<div class="tab" onclick="showScreen('treino',this)">Treino</div>
</header>

<section id="inicio" class="screen active">
<div class="card">
<h1>Adicionar registro rápido</h1>
<div class="subtitle">Use para lançar um treino de musculação direto no histórico.</div>
<div class="row">
<select id="alunoSelect"></select>
<input type="text" id="treinoRapido" placeholder="Exercício ou treino">
<button class="primary" onclick="salvarRegistroRapido()">Salvar</button>
</div>
</div>

<div class="card">
<h1>Gerenciar alunos</h1>
<div id="listaAlunos"></div>
<div class="row" style="margin-top:15px">
<input type="text" id="novoAluno" placeholder="Novo aluno">
<button class="success" onclick="adicionarAluno()">Adicionar</button>
</div>
</div>

<div class="card">
<h1>Histórico geral dos treinos</h1>
<div id="historicoGeral"></div>
</div>
</section>

<section id="crossfit" class="screen">
<div class="cross-top">
<div class="cross-day-title" id="crossDayTitle">💪 Segunda-feira</div>
<button id="crossModeBtn" class="mode-btn edit-btn" onclick="toggleCrossEdit()">✏️</button>
</div>
<div class="day-tabs" id="crossDayTabs"></div>
<div id="crossModeText" class="mode-label">Modo visualização</div>
<div id="crossfitSections"></div>
</section>

<section id="treino" class="screen">
<div class="card">
<div class="cross-top">
<div>
<h1>Treinos de Musculação</h1>
<div class="subtitle" style="margin-bottom:0">Selecione um aluno e organize as categorias de treino.</div>
</div>
<button id="treinoModeBtn" class="mode-btn edit-btn" onclick="toggleTreinoEdit()">✏️</button>
</div>
<div id="treinoModeText" class="mode-label">Modo visualização</div>
<div class="person-tabs" id="personTabs"></div>
<div id="treinoArea"></div>
</div>
</section>
</div>

<script>
let alunos=JSON.parse(localStorage.getItem("alunos"))||["Joao","Gabriel","Pedro"];
let historico=JSON.parse(localStorage.getItem("historico"))||[];
const dias=["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
let crossfit=JSON.parse(localStorage.getItem("crossfitRealCompleto"))||{};
dias.forEach(d=>{if(!crossfit[d])crossfit[d]=[
{icon:"🔥",title:"Warm-up",time:"15 min",description:"Upper Body + 3 Rounds + AMRAP final",exercises:[{name:"Novo exercício",info:"Informações do exercício",youtube:"",url:""}]},
{icon:"🧘",title:"Alongamento",time:"5 min",description:"",exercises:[{name:"Novo exercício",info:"",youtube:"",url:""}]},
{icon:"🎯",title:"Skill",time:"5 min",description:"",exercises:[{name:"Novo exercício",info:"",youtube:"",url:""}]},
{icon:"⚡",title:"WOD",time:"20 min",description:"",exercises:[{name:"Novo exercício",info:"",youtube:"",url:""}]},
{icon:"📋",title:"Complemento",time:"5 min",description:"",exercises:[{name:"Novo exercício",info:"",youtube:"",url:""}]}
]});
let treinos=JSON.parse(localStorage.getItem("treinos"))||{};
alunos.forEach(n=>{if(!treinos[n])treinos[n]={A:[],B:[],C:[],D:[],E:[]}});
let currentPerson=alunos[0]||"", currentDay=dias[0], crossEditMode=false, treinoEditMode=false, editingHistoryIndex=null;

function normalizeCrossfitExercises(){
dias.forEach(d=>{
(crossfit[d]||[]).forEach(sec=>{
(sec.exercises||[]).forEach(ex=>{
if(ex.info===undefined) ex.info="";
if(ex.url===undefined) ex.url="";
if(ex.youtube===undefined) ex.youtube="";
});
});
});
}
normalizeCrossfitExercises();
dias.forEach(d=>{
(crossfit[d]||[]).forEach(sec=>{
sec.icon = emojiCategoria(sec.title);
});
});

function saveData(){
localStorage.setItem("alunos",JSON.stringify(alunos));
localStorage.setItem("historico",JSON.stringify(historico));
localStorage.setItem("crossfitRealCompleto",JSON.stringify(crossfit));
localStorage.setItem("treinos",JSON.stringify(treinos));
}
function showScreen(id,el){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active")}

function escapeHtml(str){return String(str||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function youtubeEmbed(url){
if(!url)return "";
let id="";
if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0];
else if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0];
else if(url.includes("/shorts/")) id=url.split("/shorts/")[1].split("?")[0];
else if(url.includes("/embed/")) id=url.split("/embed/")[1].split("?")[0];
return id ? "https://www.youtube.com/embed/"+id : "";
}

function emojiCategoria(nome){
const n = String(nome||"").trim().toLowerCase();

if(n === "warm-up" || n === "warmup" || n === "aquecimento") return "🔥";
if(n === "alongamento") return "🧘";
if(n === "skill") return "🎯";
if(n === "wod") return "⚡";
if(n === "complemento") return "📋";

return "🏋️";
}

/* Início / alunos / histórico */
function renderAlunos(){
const select=document.getElementById("alunoSelect"),lista=document.getElementById("listaAlunos");select.innerHTML="";lista.innerHTML="";
alunos.forEach((nome,index)=>{select.innerHTML+=`<option value="${escapeHtml(nome)}">${escapeHtml(nome)}</option>`;lista.innerHTML+=`<div class="list-item"><div>${escapeHtml(nome)}</div><button class="danger" onclick="removerAluno(${index})">Remover</button></div>`});
renderPersonTabs();saveData();
}
function adicionarAluno(){const nome=document.getElementById("novoAluno").value.trim();if(!nome)return;alunos.push(nome);treinos[nome]={A:[],B:[],C:[],D:[],E:[]};if(!currentPerson)currentPerson=nome;document.getElementById("novoAluno").value="";renderAlunos();renderTreinoArea()}
function removerAluno(index){const nome=alunos[index];delete treinos[nome];alunos.splice(index,1);if(currentPerson===nome)currentPerson=alunos[0]||"";renderAlunos();renderTreinoArea()}
function salvarRegistroRapido(){const aluno=document.getElementById("alunoSelect").value,treino=document.getElementById("treinoRapido").value.trim();if(!aluno||!treino)return;historico.unshift({aluno,treino,data:new Date().toLocaleString("pt-BR")});document.getElementById("treinoRapido").value="";renderHistorico()}
function renderHistorico(){
const area=document.getElementById("historicoGeral");area.innerHTML="";
if(historico.length===0){area.innerHTML='<div class="subtitle">Nenhum treino registrado ainda.</div>';saveData();return}
historico.forEach((item,index)=>{
if(editingHistoryIndex===index){
const opts=alunos.map(n=>`<option value="${escapeHtml(n)}" ${item.aluno===n?"selected":""}>${escapeHtml(n)}</option>`).join("");
area.innerHTML+=`<div class="history-item"><strong>Editando registro</strong><div class="history-edit-box"><select id="editAluno-${index}">${opts}</select><input id="editTreino-${index}" value="${escapeHtml(item.treino)}" placeholder="Exercício ou treino"><input id="editData-${index}" value="${escapeHtml(item.data)}" placeholder="Data"></div><div class="history-actions"><button class="success" onclick="salvarEdicaoHistorico(${index})">Salvar edição</button><button class="danger" onclick="cancelarEdicaoHistorico()">Cancelar</button></div></div>`;
}else{
area.innerHTML+=`<div class="history-item"><strong>${escapeHtml(item.aluno)}</strong><span class="tag">${escapeHtml(item.treino)}</span><br><br><small>${escapeHtml(item.data)}</small><div class="history-actions"><button class="primary" onclick="editarHistorico(${index})">Editar</button><button class="danger" onclick="excluirHistorico(${index})">Excluir</button></div></div>`;
}});
saveData();
}
function editarHistorico(i){editingHistoryIndex=i;renderHistorico()}
function cancelarEdicaoHistorico(){editingHistoryIndex=null;renderHistorico()}
function salvarEdicaoHistorico(i){const aluno=document.getElementById("editAluno-"+i).value,treino=document.getElementById("editTreino-"+i).value.trim(),data=document.getElementById("editData-"+i).value.trim();if(!treino)return;historico[i]={aluno,treino,data:data||new Date().toLocaleString("pt-BR")};editingHistoryIndex=null;renderHistorico()}
function excluirHistorico(i){historico.splice(i,1);editingHistoryIndex=null;renderHistorico()}

/* Crossfit */
function toggleCrossEdit(){
crossEditMode=!crossEditMode;
const btn=document.getElementById("crossModeBtn"),text=document.getElementById("crossModeText");
if(crossEditMode){btn.className="mode-btn save-btn";btn.innerHTML="💾";text.innerHTML="Modo edição"}else{btn.className="mode-btn edit-btn";btn.innerHTML="✏️";text.innerHTML="Modo visualização"}
renderCrossfit();
}
function renderCrossDayTabs(){
const area=document.getElementById("crossDayTabs");area.innerHTML="";
dias.forEach(d=>{const div=document.createElement("div");div.className="day-tab "+(d===currentDay?"active":"");div.innerText=d;div.onclick=()=>{currentDay=d;renderCrossDayTabs();renderCrossfit()};area.appendChild(div)});
}
function renderCrossfit(){
document.getElementById("crossDayTitle").innerText="💪 "+currentDay;
const area=document.getElementById("crossfitSections");area.innerHTML="";
crossfit[currentDay].forEach((section,sIndex)=>{
let html=`<div class="cross-section"><div class="cross-section-header"><div><div class="cross-section-title"><span>${section.icon}</span>${crossEditMode?`<input value="${escapeHtml(section.title)}" onchange="updateCrossSection(${sIndex},'title',this.value)" placeholder="Nome da seção">`:`<span>${escapeHtml(section.title)}</span>`}</div><div class="subtitle">${crossEditMode?`<input value="${escapeHtml(section.description)}" onchange="updateCrossSection(${sIndex},'description',this.value)" placeholder="Descrição da seção">`:escapeHtml(section.description)}</div></div><div class="row" style="align-items:center">${crossEditMode?`<input style="width:95px;flex:0" value="${escapeHtml(section.time)}" onchange="updateCrossSection(${sIndex},'time',this.value)" placeholder="5 min"><button class="circle-delete" onclick="removeCrossSection(${sIndex})">🗑</button>`:`<div class="time-pill">${escapeHtml(section.time)}</div>`}</div></div><div class="cross-line"></div>`;
section.exercises.forEach((exercise,eIndex)=>{
const embed=youtubeEmbed(exercise.youtube);
if(crossEditMode){
html+=`<div class="edit-card">
<button class="circle-delete delete-abs" onclick="removeCrossExercise(${sIndex},${eIndex})">🗑</button>
<div class="exercise-info-bar">
<span>Novo exercício</span><span>Informações</span><span>YouTube</span><span>URL</span>
</div>
<input value="${escapeHtml(exercise.name)}" oninput="updateCrossExercise(${sIndex},${eIndex},'name',this.value)" placeholder="Novo exercício" style="padding-right:46px">
<input value="${escapeHtml(exercise.info)}" oninput="updateCrossExercise(${sIndex},${eIndex},'info',this.value)" placeholder="Informações">
<div class="youtube-box">▶ YouTube</div>
<input value="${escapeHtml(exercise.youtube)}" oninput="updateCrossExercise(${sIndex},${eIndex},'youtube',this.value)" placeholder="Cole a URL do YouTube">
<input value="${escapeHtml(exercise.url)}" oninput="updateCrossExercise(${sIndex},${eIndex},'url',this.value)" placeholder="URL extra / imagem / referência">
${embed?`<iframe src="${embed}" allowfullscreen></iframe>`:""}
</div>`;
}else{
html+=`<div class="exercise-card-view"><div class="exercise-left"><div class="exercise-icon">🏋️</div><div><div style="font-weight:700">${escapeHtml(exercise.name)}</div>${exercise.info?`<div class="exercise-info">${escapeHtml(exercise.info)}</div>`:""}${exercise.url?`<div class="exercise-info">🔗 ${escapeHtml(exercise.url)}</div>`:""}</div></div><div class="arrow">›</div></div>${embed?`<iframe src="${embed}" allowfullscreen></iframe>`:""}`;
}});
if(crossEditMode)html+=`<button class="add-btn" onclick="addCrossExercise(${sIndex})">+ Adicionar exercício</button>`;
html+=`</div>`;
area.innerHTML+=html;
});
if(crossEditMode)area.innerHTML+=`<button class="add-btn" onclick="addCrossSection()">+ Adicionar seção</button>`;
saveData();
}
function updateCrossSection(i,k,v){
crossfit[currentDay][i][k]=v;

if(k === "title"){
crossfit[currentDay][i].icon = emojiCategoria(v);
}

saveData();
renderCrossfit();
}
function addCrossSection(){crossfit[currentDay].push({icon:"🔥",title:"Nova seção",time:"5 min",description:"",exercises:[]});renderCrossfit()}
function removeCrossSection(i){crossfit[currentDay].splice(i,1);renderCrossfit()}
function addCrossExercise(i){crossfit[currentDay][i].exercises.push({name:"Novo exercício",info:"",youtube:"",url:""});renderCrossfit()}
function removeCrossExercise(s,e){crossfit[currentDay][s].exercises.splice(e,1);renderCrossfit()}
function updateCrossExercise(s,e,k,v){
crossfit[currentDay][s].exercises[e][k]=v;
saveData();
}

/* Treino musculação */
function renderPersonTabs(){const area=document.getElementById("personTabs");area.innerHTML="";alunos.forEach(nome=>{const div=document.createElement("div");div.className="person-btn "+(currentPerson===nome?"active":"");div.innerText=nome;div.onclick=()=>{currentPerson=nome;renderPersonTabs();renderTreinoArea()};area.appendChild(div)})}
function toggleTreinoEdit(){
treinoEditMode=!treinoEditMode;
const btn=document.getElementById("treinoModeBtn");
const text=document.getElementById("treinoModeText");

if(treinoEditMode){
btn.className="mode-btn save-btn";
btn.innerHTML="💾";
text.innerHTML="Modo edição";
}else{
btn.className="mode-btn edit-btn";
btn.innerHTML="✏️";
text.innerHTML="Modo visualização";
}

renderTreinoArea();
}

function renderTreinoArea(){
const area=document.getElementById("treinoArea");
if(!currentPerson){area.innerHTML="<p>Nenhum aluno cadastrado.</p>";return}

let html="";

if(treinoEditMode){
html+=`<div class="card add-category-box">
<h1>Adicionar categoria de treino</h1>
<div class="row">
<input id="novaCategoriaTreino" placeholder="Ex: A, B, C, Full Body, Inferiores">
<button class="success" onclick="addCategoriaTreino()">Adicionar categoria</button>
</div>
</div>`;
}

Object.keys(treinos[currentPerson]).forEach((letra)=>{
let exs="";
treinos[currentPerson][letra].forEach((ex,index)=>{
if(treinoEditMode){
exs+=`<div class="exercise"><span>${escapeHtml(ex)}</span><button class="danger" onclick="removeExercise('${escapeJs(currentPerson)}','${escapeJs(letra)}',${index})">X</button></div>`;
}else{
exs+=`<div class="exercise"><span>${escapeHtml(ex)}</span></div>`;
}
});

const safeId = makeSafeId(currentPerson+"-"+letra);

if(treinoEditMode){
html+=`<div class="card">
<div class="category-title-row">
<div class="row" style="align-items:center">
<input id="catNome-${safeId}" value="${escapeHtml(letra)}" placeholder="Nome da categoria">
<button class="primary" onclick="renameCategoriaTreino('${escapeJs(letra)}','${safeId}')">Salvar nome</button>
</div>
<div class="category-actions">
<button class="danger" onclick="removeCategoriaTreino('${escapeJs(letra)}')">Remover categoria</button>
</div>
</div>

${exs}

<div class="row" style="margin-top:10px">
<input id="ex-${safeId}" placeholder="Novo exercício">
<button class="primary" onclick="addExercise('${escapeJs(currentPerson)}','${escapeJs(letra)}','${safeId}')">Adicionar exercício</button>
</div>
</div>`;
}else{
html+=`<div class="card">
<div class="category-title-row">
<h1>Treino ${escapeHtml(letra)}</h1>
</div>
${exs || '<div class="subtitle">Nenhum exercício cadastrado.</div>'}
</div>`;
}
});

area.innerHTML=html;
saveData();
}

function makeSafeId(str){
return String(str).replace(/[^a-zA-Z0-9]/g,"_");
}

function escapeJs(str){
return String(str||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function addCategoriaTreino(){
const input=document.getElementById("novaCategoriaTreino");
const nome=input.value.trim();
if(!nome)return;
if(treinos[currentPerson][nome]){
alert("Essa categoria já existe.");
return;
}
treinos[currentPerson][nome]=[];
input.value="";
renderTreinoArea();
}

function renameCategoriaTreino(oldName,safeId){
const input=document.getElementById("catNome-"+safeId);
const newName=input.value.trim();
if(!newName)return;
if(newName!==oldName && treinos[currentPerson][newName]){
alert("Já existe uma categoria com esse nome.");
return;
}
treinos[currentPerson][newName]=treinos[currentPerson][oldName];
if(newName!==oldName) delete treinos[currentPerson][oldName];
renderTreinoArea();
}

function removeCategoriaTreino(nome){
delete treinos[currentPerson][nome];
renderTreinoArea();
}

function addExercise(person,letter,safeId){
const input=document.getElementById("ex-"+safeId);
if(!input.value.trim())return;
treinos[person][letter].push(input.value.trim());
input.value="";
renderTreinoArea();
}

function removeExercise(person,letter,index){
treinos[person][letter].splice(index,1);
renderTreinoArea();
}

renderAlunos();renderHistorico();renderCrossDayTabs();renderCrossfit();renderTreinoArea();
</script>
</body>
</html>
