<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Treino</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:#090b10;
  color:#f5f7fb;
}

.app{
  max-width:760px;
  margin:0 auto;
  padding:28px 18px 80px;
}

.header{
  text-align:center;
  padding:28px 0 22px;
}

.logo-icon{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:rgba(31,255,132,.10);
  box-shadow:0 0 34px rgba(31,255,132,.35);
  border:1px solid rgba(31,255,132,.15);
}

/* Título e subtítulo mantidos */
.logo{
  font-size:50px;
  font-weight:900;
  font-style:italic;
  letter-spacing:2px;
  line-height:1;
}

.line{
  width:130px;
  height:7px;
  border-radius:20px;
  background:linear-gradient(90deg,#22ff99,#00b7ff);
  margin:12px auto;
}

.subtitle{
  margin-top:12px;
  color:#9da6b5;
  letter-spacing:4px;
  font-size:13px;
  font-weight:bold;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:72px;
  margin-bottom:20px;
  position:relative;
}

.back-btn{
  position:absolute;
  left:0;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#171b24;
  color:white;
  font-size:26px;
  cursor:pointer;
}

.page-title{
  font-size:23px;
  font-weight:900;
}

.days-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.day-card{
  width:100%;
  border:1px solid rgba(255,255,255,.07);
  background:#151922;
  color:white;
  border-radius:18px;
  padding:22px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  min-height:96px;
  cursor:pointer;
  box-shadow:0 18px 28px rgba(0,0,0,.20);
  text-align:left;
}

.day-emoji{
  min-width:58px;
  height:58px;
  border-radius:14px;
  background:#0d3425;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.day-info{
  flex:1;
}

.day-name{
  font-size:20px;
  font-weight:900;
  margin-bottom:6px;
}

.day-sub{
  color:#858d9b;
  font-size:15px;
  font-weight:700;
}

.arrow{
  color:#858d9b;
  font-size:34px;
}

.section{
  margin:28px 0 36px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 4px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:18px;
}

.section-title{
  font-size:25px;
  font-weight:900;
  color:#45baf2;
}

.section-title.aquecimento,
.section-title.warmup{
  color:#ff8b3d;
}

.section-title.skill{
  color:#38e378;
}

.section-title.wod{
  color:#ff3f7f;
}

.section-count{
  min-width:38px;
  height:28px;
  padding:0 10px;
  border-radius:999px;
  background:#0d3425;
  color:#38e378;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.exercise-card{
  width:100%;
  border:0;
  background:#262b34;
  color:white;
  border-radius:14px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
  min-height:78px;
  cursor:pointer;
  text-align:left;
}

.thumb{
  min-width:54px;
  height:54px;
  border-radius:12px;
  background:#030303;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.exercise-name{
  flex:1;
  font-size:17px;
  font-weight:800;
  line-height:1.25;
}

.exercise-meta{
  color:#9ca4b2;
  font-size:13px;
  margin-top:5px;
}

.empty{
  margin-top:22px;
  background:#151922;
  color:#aeb6c4;
  border-radius:18px;
  padding:22px;
  font-size:17px;
  border:1px solid rgba(255,255,255,.06);
}

.video-wrap{
  margin:38px auto 28px;
  max-width:520px;
  border-radius:18px;
  overflow:hidden;
  background:#111;
  box-shadow:0 22px 45px rgba(0,0,0,.35);
}

.video-box{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video-box iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.detail-card{
  max-width:520px;
  margin:0 auto;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  background:#0e3041;
  color:#45baf2;
  margin-bottom:18px;
}

.detail-title{
  font-size:26px;
  font-weight:900;
  margin-bottom:14px;
}

.detail-info{
  color:#b3bac7;
  margin:8px 0;
  line-height:1.45;
}

.video-link{
  display:inline-block;
  margin-top:18px;
  background:#22ff99;
  color:#03140d;
  text-decoration:none;
  padding:14px 18px;
  border-radius:999px;
  font-weight:900;
  box-shadow:0 0 24px rgba(34,255,153,.28);
}

.hidden{
  display:none;
}

@media(max-width:640px){
  .app{
    padding:22px 16px 70px;
  }

  .logo{
    font-size:44px;
  }

  .subtitle{
    font-size:11px;
    letter-spacing:3px;
  }

  .day-card{
    min-height:90px;
    padding:18px 16px;
  }

  .day-name{
    font-size:18px;
  }

  .section-title{
    font-size:23px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div id="homeView">
    <div class="header">
      <div class="logo-icon">🏋️</div>

      <div class="logo">TREINO</div>
      <div class="line"></div>
      <div class="subtitle">TREINO • PERFORMANCE • EVOLUÇÃO</div>
    </div>

    <div class="days-list" id="daysList"></div>
  </div>

  <div id="dayView" class="hidden">
    <div class="topbar">
      <button class="back-btn" onclick="voltarHome()">‹</button>
      <div class="page-title" id="dayTitle"></div>
    </div>

    <div id="dayContent"></div>
  </div>

  <div id="exerciseView" class="hidden">
    <div class="topbar">
      <button class="back-btn" onclick="voltarDia()">‹</button>
      <div>
        <div style="color:#8d96a5;font-size:14px;text-align:center;">do exercício</div>
        <div id="exerciseCounter" style="color:#22ff99;font-size:13px;font-weight:900;text-align:center;margin-top:4px;"></div>
      </div>
    </div>

    <div id="exerciseContent"></div>
  </div>

</div>

<script>
const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTxxcHY_9_SE0TZy40I7dG1bfYfns65q7VdJF-Bm7vK5RhGTe8R_ZIkcL2hwAKyTNuuSCbkF1bwgmL4Pjr26HoaXBVdOezm16KEEjXdxoYe0gpy5nosPRSc6fB4NbE0vUnPxJFJqt7BePJ9wMa73ACkbpFl7n0R2OSTiyO44n0HfQCqghpnvjPsGlkPmNhcMNk_heWopRjqwF7e__NB-tB5-D13cD6g2iDvlj_R1YeSyVM3dnqZZIhghl_GMpySZ9_cxRIcHpi_Z-4ZtyhQBasX6WysTA&lib=MugMYOnr_k_7GWZLjrOLbJyIO1ye3IR6Q";

const dias = [
  {key:"Segunda", label:"Segunda-feira", emoji:"💪"},
  {key:"Terça", label:"Terça-feira", emoji:"🔥"},
  {key:"Quarta", label:"Quarta-feira", emoji:"⚡"},
  {key:"Quinta", label:"Quinta-feira", emoji:"🏆"},
  {key:"Sexta", label:"Sexta-feira", emoji:"💥"},
  {key:"Sábado", label:"Sábado", emoji:"🎯"}
];

let treinos = [];
let diaAtual = "Segunda";
let listaAtual = [];

function normalizarTexto(texto){
  return String(texto || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function limparLink(link){
  const url = String(link || "").trim();
  if(!url) return "";
  if(url.startsWith("http://") || url.startsWith("https://")) return url;
  return "https://" + url;
}

function youtubeEmbed(url){
  const link = limparLink(url);
  if(!link) return "";

  let id = "";

  try{
    const u = new URL(link);

    if(u.hostname.includes("youtu.be")){
      id = u.pathname.replace("/", "");
    }

    if(u.hostname.includes("youtube.com")){
      if(u.pathname.includes("/shorts/")){
        id = u.pathname.split("/shorts/")[1].split("/")[0];
      }else if(u.searchParams.get("v")){
        id = u.searchParams.get("v");
      }
    }
  }catch(e){}

  if(!id) return "";

  return "https://www.youtube.com/embed/" + id;
}

function secaoClasse(secao){
  const s = normalizarTexto(secao);
  if(s.includes("aquecimento")) return "aquecimento";
  if(s.includes("warm")) return "warmup";
  if(s.includes("skill") || s.includes("habilidade")) return "skill";
  if(s.includes("wod")) return "wod";
  if(s.includes("along")) return "alongamento";
  return "alongamento";
}

function secaoEmoji(secao){
  const s = normalizarTexto(secao);
  if(s.includes("along")) return "🧘";
  if(s.includes("aquecimento")) return "🔥";
  if(s.includes("warm")) return "🔥";
  if(s.includes("skill") || s.includes("habilidade")) return "🎯";
  if(s.includes("wod")) return "🏋️";
  return "💪";
}

function mostrar(view){
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("exerciseView").classList.add("hidden");
  document.getElementById(view).classList.remove("hidden");
  window.scrollTo(0,0);
}

function carregar(){
  renderDias();

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      treinos = Array.isArray(data) ? data : [];
      renderDias();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("daysList").innerHTML =
        '<div class="empty">Erro ao carregar os treinos da planilha.</div>';
    });
}

function renderDias(){
  const area = document.getElementById("daysList");

  area.innerHTML = dias.map(dia => {
    const qtd = treinos.filter(t => normalizarTexto(t.Dia) === normalizarTexto(dia.key)).length;
    const texto = qtd > 0 ? `${qtd} treino${qtd > 1 ? "s" : ""} disponível${qtd > 1 ? "s" : ""}` : "Toque para ver o treino";

    return `
      <button class="day-card" onclick="abrirDia('${dia.key}')">
        <div class="day-emoji">${dia.emoji}</div>
        <div class="day-info">
          <div class="day-name">${dia.label}</div>
          <div class="day-sub">${texto}</div>
        </div>
        <div class="arrow">›</div>
      </button>
    `;
  }).join("");
}

function abrirDia(dia){
  diaAtual = dia;
  const config = dias.find(d => normalizarTexto(d.key) === normalizarTexto(dia));
  document.getElementById("dayTitle").innerHTML = `${config ? config.emoji : "💪"} ${config ? config.label : dia}`;

  listaAtual = treinos.filter(t => normalizarTexto(t.Dia) === normalizarTexto(diaAtual));

  const area = document.getElementById("dayContent");

  if(listaAtual.length === 0){
    area.innerHTML = '<div class="empty">Nenhum treino encontrado para este dia.</div>';
    mostrar("dayView");
    return;
  }

  const grupos = {};
  listaAtual.forEach((t, index) => {
    const secao = String(t.Secao || "Treino").trim();
    if(!grupos[secao]) grupos[secao] = [];
    grupos[secao].push({...t, originalIndex:index});
  });

  area.innerHTML = Object.keys(grupos).map(secao => {
    const classe = secaoClasse(secao);
    const emoji = secaoEmoji(secao);

    const itens = grupos[secao].map(item => `
      <button class="exercise-card" onclick="abrirExercicio(${item.originalIndex})">
        <div class="thumb">${limparLink(item.YouTube) ? "▶" : ""}</div>
        <div>
          <div class="exercise-name">${item.Treino || "Treino"}</div>
          <div class="exercise-meta">${item.Tempo || ""}${item.Carga ? " • " + item.Carga : ""}</div>
        </div>
        <div class="arrow">›</div>
      </button>
    `).join("");

    return `
      <div class="section">
        <div class="section-head">
          <div class="section-title ${classe}">${emoji} ${secao}</div>
          ${grupos[secao].length > 1 ? `<div class="section-count">${grupos[secao].length}</div>` : ""}
        </div>
        ${itens}
      </div>
    `;
  }).join("");

  mostrar("dayView");
}

function abrirExercicio(index){
  const treino = listaAtual[index];
  if(!treino) return;

  const link = limparLink(treino.YouTube);
  const embed = youtubeEmbed(link);
  const secao = treino.Secao || "Treino";
  const emoji = secaoEmoji(secao);

  document.getElementById("exerciseCounter").textContent = `${index + 1} / ${listaAtual.length}`;

  document.getElementById("exerciseContent").innerHTML = `
    <div class="video-wrap">
      <div class="video-box">
        ${
          embed
          ? `<iframe src="${embed}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`
          : `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#8d96a5;padding:20px;text-align:center;">Sem vídeo cadastrado</div>`
        }
      </div>
    </div>

    <div class="detail-card">
      <div class="badge">${emoji} ${secao}</div>
      <div class="detail-title">${treino.Treino || "Treino"}</div>

      ${treino.Tempo ? `<div class="detail-info">⏱ Tempo: ${treino.Tempo}</div>` : ""}
      ${treino.Carga ? `<div class="detail-info">🏋️ Carga: ${treino.Carga}</div>` : ""}
      ${treino.Informacoes ? `<div class="detail-info">📝 ${treino.Informacoes}</div>` : ""}

      ${link ? `<a class="video-link" href="${link}" target="_blank" rel="noopener noreferrer">Assistir no YouTube</a>` : ""}
    </div>
  `;

  mostrar("exerciseView");
}

function voltarHome(){
  mostrar("homeView");
}

function voltarDia(){
  abrirDia(diaAtual);
}

carregar();
</script>
</body>
</html>
