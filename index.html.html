<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Treino</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  background:
  radial-gradient(circle at top,#003b5f 0%,#00152b 40%,#000814 100%);
  color:white;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  font-size:64px;
  font-weight:900;
  font-style:italic;
  letter-spacing:2px;
}

.line{
  width:140px;
  height:8px;
  border-radius:20px;
  background:linear-gradient(90deg,#00ff9d,#00b7ff);
  margin:10px auto;
}

.subtitle{
  margin-top:12px;
  color:#9fb3c8;
  letter-spacing:4px;
  font-size:14px;
  font-weight:bold;
}

.card{
  background:rgba(0,20,50,0.55);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:28px;
  padding:25px;
}

.mode{
  display:inline-block;
  padding:12px 20px;
  border-radius:20px;
  background:rgba(255,255,255,0.06);
  margin-bottom:25px;
  font-weight:bold;
}

.mode span{
  color:#33ff99;
}

.days{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}

.day-btn{
  height:62px;
  border:none;
  border-radius:20px;
  background:linear-gradient(180deg,#071c44,#04112c);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.25s;
  box-shadow:
  inset 0 0 0 1px rgba(255,255,255,0.05),
  0 8px 20px rgba(0,0,0,0.35);
}

.day-btn.active{
  background:linear-gradient(90deg,#22ff99,#66ffcc);
  color:#001b14;
}

.content{
  background:rgba(0,0,0,0.18);
  border-radius:22px;
  padding:20px;
  min-height:150px;
}

.empty{
  color:#c9d2dd;
  font-size:20px;
}

.treino-card{
  background:rgba(255,255,255,0.04);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  border:1px solid rgba(255,255,255,0.06);
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.aquecimento{
  background:#ff9800;
  color:black;
}

.warmup{
  background:#ff9800;
  color:black;
}

.skill{
  background:#00b7ff;
}

.wod{
  background:#ff2d75;
}

.titulo{
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
}

.info{
  margin:6px 0;
  color:#d7e1ea;
}

.link{
  display:inline-block;
  margin-top:12px;
  text-decoration:none;
  color:#00ffaa;
  font-weight:bold;
}

@media(max-width:700px){

.days{
  grid-template-columns:1fr 1fr;
}

.logo{
  font-size:48px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">TREINO</div>
<div class="line"></div>
<div class="subtitle">
TREINO • PERFORMANCE • EVOLUÇÃO
</div>
</div>

<div class="card">

<div class="mode">
Modo: <span>VISUALIZAÇÃO</span>
</div>

<div class="days">

<button class="day-btn active" onclick="selecionarDia('Segunda',this)">SEGUNDA</button>

<button class="day-btn" onclick="selecionarDia('Terça',this)">TERÇA</button>

<button class="day-btn" onclick="selecionarDia('Quarta',this)">QUARTA</button>

<button class="day-btn" onclick="selecionarDia('Quinta',this)">QUINTA</button>

<button class="day-btn" onclick="selecionarDia('Sexta',this)">SEXTA</button>

<button class="day-btn" onclick="selecionarDia('Sábado',this)">SÁBADO</button>

</div>

<div class="content" id="content">
<div class="empty">
Carregando treinos...
</div>
</div>

</div>
</div>

<script>

const API_URL =
"https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnR7IKQS3ueT0XcuTQynxukp0mJUp-OrgBRCD4Y380fz-dBO90zgqu0whtBXGb1cxnllv51MYNm9pPUMQAuZz-_6iepgdBot3A6FLszY03GZKfGZb-FHPt_oeXD7FFDcJsJTsaZmIxlGaXstG7pqmCAUrq1NVD0t4WamCwIdAlF1O6T1HilIYYZbbyy7gHAfTmB3nV-SCx6kW-KsckyNYqrJS6vP_1CosjUtcqH0kXGTglNed-bFNLUKos5zluCdV9hZlmItaAia34-95Ae1Y737yrh7IQ&lib=M3U3XonLC9hA4eBuugyms0QTwzsJJmP1z";

let treinos = [];
let diaAtual = "Segunda";

function carregarTreinosDaPlanilha(){

fetch(API_URL)
.then(res => res.json())
.then(data => {

treinos = data;
renderizarTreinos();

})
.catch(error => {

console.error(error);

document.getElementById("content").innerHTML =
'<div class="empty">Erro ao carregar os treinos da planilha.</div>';

});

}

function selecionarDia(dia,botao){

diaAtual = dia;

document.querySelectorAll(".day-btn")
.forEach(btn => btn.classList.remove("active"));

botao.classList.add("active");

renderizarTreinos();

}

function getClasseSecao(secao){

if(!secao) return "skill";

const s = secao.toLowerCase();

if(s.includes("aquecimento")) return "aquecimento";
if(s.includes("warm")) return "warmup";
if(s.includes("skill")) return "skill";
if(s.includes("wod")) return "wod";

return "skill";

}

function renderizarTreinos(){

const area = document.getElementById("content");

const filtrados = treinos.filter(t =>
t.Dia &&
t.Dia.trim().toLowerCase() ===
diaAtual.toLowerCase()
);

if(filtrados.length === 0){

area.innerHTML =
'<div class="empty">Nenhum treino encontrado.</div>';

return;

}

area.innerHTML = "";

filtrados.forEach(treino => {

const card = document.createElement("div");
card.className = "treino-card";

const classe = getClasseSecao(treino.Secao);

card.innerHTML = `

<div class="badge ${classe}">
${treino.Secao || "Treino"}
</div>

<div class="titulo">
${treino.Treino || "-"}
</div>

<div class="info">
⏱ Tempo: ${treino.Tempo || "-"}
</div>

<div class="info">
🏋️ Carga: ${treino.Carga || "-"}
</div>

<div class="info">
📝 ${treino.Informacoes || "-"}
</div>

${
treino.YouTube
?
`<a class="link" href="${treino.YouTube}" target="_blank">
▶ Ver vídeo
</a>`
:
""
}

`;

area.appendChild(card);

});

}

carregarTreinosDaPlanilha();

</script>

</body>
</html>
