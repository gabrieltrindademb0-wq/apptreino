<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meu Treino</title>

<style>
:root{
  --text:#f8fafc;
  --muted:#9fb0c7;
  --primary:#19e58c;
  --secondary:#1aa7ff;
  --accent:#ff7a18;
  --line:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
  min-height:100vh;
  color:var(--text);
  padding:18px;
  background:
    linear-gradient(135deg,rgba(25,229,140,.14),transparent 28%),
    radial-gradient(circle at 90% 8%,rgba(26,167,255,.22),transparent 30%),
    #06101e;
}
.app-title{
  width:max-content;
  max-width:100%;
  margin:12px auto 44px;
  text-align:center;
  font-size:clamp(38px,7vw,74px);
  font-weight:1000;
  letter-spacing:4px;
  line-height:.95;
  text-transform:uppercase;
  font-style:italic;
  transform:skewX(-8deg);
  position:relative;
}
.app-title::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-14px;
  width:68%;
  height:6px;
  transform:translateX(-50%) skewX(-18deg);
  border-radius:999px;
  background:linear-gradient(90deg,#19e58c,#1aa7ff);
}
.app-title::after{
  content:"TREINO • PERFORMANCE • EVOLUÇÃO";
  position:absolute;
  left:50%;
  bottom:-40px;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#8ea2bf;
  font-size:12px;
  font-weight:900;
  letter-spacing:4px;
}
.container{
  max-width:1240px;
  margin:44px auto 0;
  background:linear-gradient(180deg,rgba(15,29,52,.96),rgba(7,17,31,.98));
  border:1px solid rgba(255,255,255,.10);
  border-radius:26px;
  box-shadow:0 24px 90px rgba(0,0,0,.42);
  padding:34px;
}
.mode{
  display:inline-flex;
  gap:8px;
  color:var(--muted);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:10px 15px;
  font-size:15px;
  font-weight:900;
  margin-bottom:18px;
}
.mode span{color:var(--primary);text-transform:uppercase}
.day-tabs{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:30px;
}
.day-tab{
  background:linear-gradient(180deg,#17263f,#0f1a2c);
  color:#d8e3f2;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:15px 10px;
  text-align:center;
  cursor:pointer;
  font-weight:1000;
  text-transform:uppercase;
}
.day-tab.active{
  background:linear-gradient(135deg,var(--primary),#5cffba);
  color:#03140c;
}
.section{
  margin:30px 0 38px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:20px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:16px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:30px;
  font-weight:1000;
  text-transform:uppercase;
}
.section-icon{
  width:52px;
  height:52px;
  border-radius:17px;
  background:linear-gradient(135deg,rgba(25,229,140,.18),rgba(26,167,255,.14));
  border:1px solid rgba(25,229,140,.42);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}
.time-pill{
  color:#03140c;
  background:linear-gradient(135deg,var(--primary),#5cffba);
  padding:10px 18px;
  border-radius:999px;
  font-weight:1000;
}
.exercise-view{
  display:grid;
  grid-template-columns:1.18fr 1.32fr;
  gap:12px;
  margin-bottom:14px;
}
.exercise-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(135deg,#172842,#101b2d);
  border:1px solid rgba(255,255,255,.08);
}
.exercise-left{
  display:flex;
  align-items:center;
  gap:16px;
}
.exercise-icon{
  width:70px;
  height:70px;
  border-radius:18px;
  background:linear-gradient(135deg,#091426,#132a45);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}
.exercise-name{
  font-size:23px;
  font-weight:1000;
  margin-bottom:6px;
}
.exercise-info{
  color:#c9d5e7;
  line-height:1.45;
  white-space:pre-line;
}
.arrow{
  font-size:34px;
  color:var(--accent);
}
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.metric{
  background:linear-gradient(180deg,#17263f,#0f1a2c);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:12px 10px;
  min-height:102px;
}
.metric small{
  color:#aebbd0;
  text-transform:uppercase;
  font-weight:1000;
  font-size:12px;
  margin-bottom:12px;
}
.metric strong{font-size:22px}
.youtube{
  margin-top:12px;
  width:100%;
  height:260px;
  border:0;
  border-radius:18px;
}
.empty{
  color:var(--muted);
  padding:18px;
  background:rgba(255,255,255,.035);
  border-radius:16px;
}
@media(max-width:980px){
  .container{padding:22px}
  .day-tabs{grid-template-columns:repeat(3,1fr)}
  .exercise-view{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  body{padding:10px}
  .app-title{font-size:34px}
  .section{padding:14px}
  .section-title{font-size:24px}
  .day-tabs{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<h1 class="app-title">TREINO</h1>

<main class="container">
  <div class="mode">Modo: <span>visualização</span></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="content">
    <div class="empty">Carregando treinos...</div>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwiUBYTqFnGSxDO-mzAFBpXc5nMSe8O90Ex-Au2dCInAb_wL0pWjrLA6yBa6wrTMRFr/exec";

const dias = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
let currentDay = "Segunda";

let treinos = {
  "Segunda":[],
  "Terça":[],
  "Quarta":[],
  "Quinta":[],
  "Sexta":[],
  "Sábado":[]
};

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function youtubeEmbed(url){
  if(!url) return "";
  let id="";
  if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0];
  else if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0];
  else if(url.includes("/shorts/")) id=url.split("/shorts/")[1].split("?")[0];
  else if(url.includes("/embed/")) id=url.split("/embed/")[1].split("?")[0];
  return id ? "https://www.youtube.com/embed/"+id : "";
}

function iconBySectionName(nome){
  nome = String(nome || "").toLowerCase();
  if(nome.includes("aquecimento")) return "🔥";
  if(nome.includes("warm")) return "🏃";
  if(nome.includes("skill")) return "🎯";
  if(nome.includes("wod")) return "⚡";
  return "💪";
}

function renderTabs(){
  const area = document.getElementById("dayTabs");
  area.innerHTML = "";

  dias.forEach(dia => {
    const btn = document.createElement("div");
    btn.className = "day-tab" + (dia === currentDay ? " active" : "");
    btn.innerText = dia;

    btn.onclick = () => {
      currentDay = dia;
      renderTabs();
      render();
    };

    area.appendChild(btn);
  });
}

function render(){
  const area = document.getElementById("content");
  area.innerHTML = "";

  const sections = treinos[currentDay] || [];

  if(!sections.length){
    area.innerHTML = '<div class="empty">Nenhum treino cadastrado para este dia.</div>';
    return;
  }

  sections.forEach(section => {
    area.innerHTML += renderViewSection(section);
  });
}

function renderViewSection(section){
  let html = `
  <section class="section">
    <div class="section-head">
      <div class="section-title">
        <span class="section-icon">${escapeHtml(section.icon)}</span>
        <span>${escapeHtml(section.title)}</span>
      </div>
      <div class="time-pill">${escapeHtml(section.time || "0")} min</div>
    </div>`;

  section.exercises.forEach(ex => {
    const embed = youtubeEmbed(ex.youtube);

    html += `
      <div class="exercise-view">
        <div class="exercise-main">
          <div class="exercise-left">
            <div class="exercise-icon">${escapeHtml(ex.icon || "🏋️")}</div>
            <div>
              <div class="exercise-name">${escapeHtml(ex.name)}</div>
              <div class="exercise-info">${escapeHtml(ex.info)}</div>
            </div>
          </div>
          <div class="arrow">→</div>
        </div>

        <div class="metrics">
          <div class="metric"><small>Séries</small><strong>${escapeHtml(ex.series || "–")}</strong></div>
          <div class="metric"><small>Repetições</small><strong>${escapeHtml(ex.reps || "–")}</strong></div>
          <div class="metric"><small>Carga</small><strong>${escapeHtml(ex.carga || "–")}</strong></div>
          <div class="metric"><small>Descanso</small><strong>${escapeHtml(ex.descanso || "–")}</strong></div>
        </div>
      </div>

      ${embed ? `<iframe class="youtube" src="${embed}" allowfullscreen></iframe>` : ""}
    `;
  });

  html += '</section>';
  return html;
}

function carregarTreinosDaPlanilha(){
  const antigo = document.getElementById("jsonpTreinos");
  if(antigo) antigo.remove();

  const script = document.createElement("script");
  script.id = "jsonpTreinos";
  script.src = API_URL + "?callback=receberTreinos&t=" + Date.now();
  script.onerror = function(){
    document.getElementById("content").innerHTML =
      '<div class="empty">Erro ao carregar os treinos da planilha.</div>';
  };

  document.body.appendChild(script);
}

function receberTreinos(dados){
  treinos = {
    "Segunda":[],
    "Terça":[],
    "Quarta":[],
    "Quinta":[],
    "Sexta":[],
    "Sábado":[]
  };

  dados.forEach(item => {
    const dia = String(item.Dia || item.dia || "").trim();

    const secao = String(
      item.Secao ||
      item.Seção ||
      item.secao ||
      item.seção ||
      ""
    ).trim();

    if(!treinos[dia]) return;

    treinos[dia].push({
      title: secao,
      icon: iconBySectionName(secao),
      time: item.Tempo || item.tempo || "",
      exercises:[
        {
          icon:"🏋️",
          name:item.Treino || item.treino || "",
          info:item.Informacoes || item.Informações || item.informacoes || item.informações || "",
          series:"–",
          reps:"–",
          carga:item.Carga || item.carga || "–",
          descanso:"–",
          youtube:item.YouTube || item.Youtube || item.youtube || ""
        }
      ]
    });
  });

  renderTabs();
  render();
}

renderTabs();
carregarTreinosDaPlanilha();
</script>

</body>
</html>
