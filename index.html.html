<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meu Treino</title>
<style>
:root{
  --bg:#07111f;
  --panel:#0b1628;
  --panel2:#101d32;
  --card:#13223a;
  --card2:#0d1728;
  --line:rgba(255,255,255,.12);
  --text:#f8fafc;
  --muted:#9fb0c7;
  --primary:#19e58c;
  --secondary:#1aa7ff;
  --accent:#ff7a18;
  --red:#ff3b5f;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  color:var(--text);
  padding:18px;
  padding-top:26px;
  background:
    linear-gradient(135deg,rgba(25,229,140,.14),transparent 28%),
    radial-gradient(circle at 90% 8%,rgba(26,167,255,.22),transparent 30%),
    radial-gradient(circle at 20% 100%,rgba(255,122,24,.14),transparent 26%),
    #06101e;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,transparent 0 46%,rgba(255,255,255,.045) 46% 47%,transparent 47% 100%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px);
  opacity:.45;
}

.app-title{
  position:relative;
  width:max-content;
  max-width:100%;
  margin:12px auto 30px;
  text-align:center;
  font-size:clamp(38px,7vw,74px);
  font-weight:1000;
  letter-spacing:4px;
  line-height:.95;
  text-transform:uppercase;
  color:#f8fafc;
  font-style:italic;
  transform:skewX(-8deg);
  text-shadow:
    0 2px 0 rgba(255,255,255,.04),
    0 12px 28px rgba(0,0,0,.45);
}
.app-title::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-14px;
  width:68%;
  height:6px;
  transform:translateX(-50%) skewX(-18deg);
  border-radius:999px;
  background:linear-gradient(90deg,#19e58c,#1aa7ff);
  box-shadow:0 0 22px rgba(25,229,140,.16);
}
.app-title::after{
  content:"TREINO • PERFORMANCE • EVOLUÇÃO";
  position:absolute;
  left:50%;
  bottom:-40px;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#8ea2bf;
  font-size:12px;
  font-weight:900;
  letter-spacing:4px;
}
100%{background-position:300% 50%}
}
.container{
  position:relative;
  max-width:1240px;
  margin:0 auto;
  background:
    linear-gradient(180deg,rgba(15,29,52,.96),rgba(7,17,31,.98));
  border:1px solid rgba(255,255,255,.10);
  border-radius:26px;
  box-shadow:0 24px 90px rgba(0,0,0,.42);
  padding:34px;
  margin-top:44px;
  overflow:hidden;
}
.container::before{
  content:"";
  position:absolute;
  top:-90px;
  right:-120px;
  width:340px;
  height:340px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(25,229,140,.22),transparent 65%);
}
.container::after{
  content:"PERFORMANCE";
  position:absolute;
  right:22px;
  bottom:18px;
  font-size:78px;
  font-weight:1000;
  letter-spacing:3px;
  color:rgba(255,255,255,.025);
  pointer-events:none;
}
.topbar{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:18px;
  margin-bottom:24px;
}

.actions{display:flex;gap:14px;align-items:center}
.round-btn{
  width:68px;
  height:68px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  transform:skew(-6deg);
}
.round-btn:hover{transform:skew(-6deg) translateY(-2px)}
.edit-btn{
  background:linear-gradient(135deg,var(--secondary),#1764ff);
  color:#fff;
  box-shadow:0 14px 32px rgba(26,167,255,.25);
}
.save-btn{
  background:linear-gradient(135deg,var(--primary),#0fb86f);
  color:#03140c;
  box-shadow:0 14px 32px rgba(25,229,140,.25);
}
.mode{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:10px 15px;
  font-size:15px;
  font-weight:900;
  margin-bottom:18px;
}
.mode span{color:var(--primary);text-transform:uppercase}
.day-tabs{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:30px;
}
.day-tab{
  background:linear-gradient(180deg,#17263f,#0f1a2c);
  color:#d8e3f2;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:15px 10px;
  text-align:center;
  cursor:pointer;
  font-weight:1000;
  text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:.18s;
}
.day-tab:hover{border-color:rgba(25,229,140,.45);transform:translateY(-1px)}
.day-tab.active{
  background:linear-gradient(135deg,var(--primary),#5cffba);
  color:#03140c;
  box-shadow:0 12px 30px rgba(25,229,140,.22);
}
.section{
  position:relative;
  z-index:1;
  margin:30px 0 38px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:20px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:16px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:30px;
  font-weight:1000;
  text-transform:uppercase;
}
.section-icon{
  width:52px;
  height:52px;
  border-radius:17px;
  background:linear-gradient(135deg,rgba(25,229,140,.18),rgba(26,167,255,.14));
  border:1px solid rgba(25,229,140,.42);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}
.time-pill{
  color:#03140c;
  background:linear-gradient(135deg,var(--primary),#5cffba);
  padding:10px 18px;
  border-radius:999px;
  font-weight:1000;
  min-width:94px;
  text-align:center;
  box-shadow:0 12px 28px rgba(25,229,140,.18);
}
.exercise-view{
  display:grid;
  grid-template-columns:1.18fr 1.32fr;
  gap:12px;
  margin-bottom:14px;
}
.exercise-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(135deg,#172842,#101b2d);
  border:1px solid rgba(255,255,255,.08);
}
.exercise-left{
  display:flex;
  align-items:center;
  gap:16px;
}
.exercise-icon{
  width:70px;
  height:70px;
  border-radius:18px;
  background:linear-gradient(135deg,#091426,#132a45);
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}
.exercise-name{
  font-size:23px;
  font-weight:1000;
  margin-bottom:6px;
}
.exercise-info{
  color:#c9d5e7;
  line-height:1.45;
  white-space:pre-line;
}
.arrow{
  font-size:34px;
  color:var(--accent);
  opacity:.95;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.metric{
  background:linear-gradient(180deg,#17263f,#0f1a2c);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:12px 10px;
  min-height:102px;
}
.metric small{
  color:#aebbd0;
  text-transform:uppercase;
  font-weight:1000;
  font-size:12px;
  margin-bottom:12px;
}
.metric strong{
  font-size:24px;
  color:#fff;
}
.edit-section{
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#15243d,#101b2e);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  padding:18px;
  margin:18px 0;
}
.edit-grid{
  display:grid;
  grid-template-columns:70px 1fr 100px 46px;
  gap:12px;
  align-items:center;
}
.exercise-edit-row{
  display:grid;
  grid-template-columns:62px 1.1fr 1.35fr .7fr .85fr .85fr .85fr 46px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
input,textarea,select{
  width:100%;
  background:#0b1526;
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  color:white;
  padding:13px 14px;
  font-size:15px;
  outline:none;
}
input:focus,textarea:focus{
  border-color:rgba(25,229,140,.8);
  box-shadow:0 0 0 3px rgba(25,229,140,.10);
}
textarea{resize:vertical;min-height:54px}
.del{
  width:42px;
  height:42px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--red),#ff6b7e);
  color:white;
  font-size:24px;
  font-weight:1000;
  cursor:pointer;
}
.add-btn{
  display:block;
  width:42%;
  margin:20px auto 0;
  background:rgba(255,255,255,.04);
  border:1px dashed rgba(25,229,140,.55);
  border-radius:16px;
  color:#dfffee;
  font-weight:1000;
  font-size:17px;
  padding:15px;
  cursor:pointer;
  text-transform:uppercase;
}
.add-btn:hover{background:rgba(25,229,140,.09)}
.add-section-btn{width:100%;margin-top:28px}
.youtube{
  margin-top:12px;
  width:100%;
  height:260px;
  border:0;
  border-radius:18px;
}
.empty{
  color:var(--muted);
  padding:18px;
  background:rgba(255,255,255,.035);
  border-radius:16px;
}
@media(max-width:980px){
  .container{padding:22px}
  .brand{font-size:32px}
  .round-btn{width:58px;height:58px;font-size:24px}
  .day-tabs{grid-template-columns:repeat(3,1fr)}
  .exercise-view{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .edit-grid,.exercise-edit-row{grid-template-columns:1fr}
  .add-btn{width:100%}
}
@media(max-width:540px){
  body{padding:10px}
  .app-title{font-size:34px}
  .topbar{align-items:flex-start}
  .brand{font-size:28px}
  .actions{gap:10px}
  .section{padding:14px}
  .section-title{font-size:24px}
  .day-tabs{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<h1 class="app-title">TREINO</h1>

<main class="container">
  <div class="topbar">
    <div class="actions">
      <button id="editBtn" class="round-btn edit-btn" onclick="toggleEdit()" title="Editar">⚡</button>    </div>
  </div>

  <div class="mode">Modo: <span id="modeText">visualização</span></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="content"></div>
</main>

<script>
const dias = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
let currentDay = dias[0];
let editMode = false;

let treinos = JSON.parse(localStorage.getItem("meuTreinoCrossfit")) || {
  "Segunda":[
    {
      title:"Aquecimento",
      icon:"🔥",
      time:"10",
      exercises:[
        {icon:"🏃",name:"Mobilidade",info:"Mobilidade de ombro, quadril e tornozelo\\n+ ativação",series:"2",reps:"–",carga:"–",descanso:"–",youtube:""}
      ]
    },
    {
      title:"WOD",
      icon:"⚡",
      time:"15",
      exercises:[
        {icon:"🏋️",name:"For Time",info:"21 - 15 - 9\\nThruster\\nPull Up",series:"–",reps:"–",carga:"–",descanso:"–",youtube:""}
      ]
    }
  ],
  "Terça":[], "Quarta":[], "Quinta":[], "Sexta":[], "Sábado":[], "Domingo":[]
};

dias.forEach(d=>{ if(!treinos[d]) treinos[d]=[]; });

function saveData(){
  localStorage.setItem("meuTreinoCrossfit", JSON.stringify(treinos));
}

function escapeHtml(str){
  return String(str ?? "").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function youtubeEmbed(url){
  if(!url) return "";
  let id="";
  if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0];
  else if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0];
  else if(url.includes("/shorts/")) id=url.split("/shorts/")[1].split("?")[0];
  else if(url.includes("/embed/")) id=url.split("/embed/")[1].split("?")[0];
  return id ? "https://www.youtube.com/embed/"+id : "";
}


const tiposSecao = [
  {nome:"Aquecimento", icon:"🔥"},
  {nome:"Warm-up", icon:"🏃"},
  {nome:"Skill", icon:"🎯"},
  {nome:"WOD", icon:"⚡"}
];

function iconBySectionName(nome){
  const item = tiposSecao.find(t => t.nome.toLowerCase() === String(nome || "").toLowerCase());
  return item ? item.icon : "💪";
}

function sectionOptions(selected){
  return tiposSecao.map(t => `<option value="${escapeHtml(t.nome)}" ${String(selected||"").toLowerCase() === t.nome.toLowerCase() ? "selected" : ""}>${escapeHtml(t.icon + " " + t.nome)}</option>`).join("");
}

function updateSectionType(index, value){
  treinos[currentDay][index].title = value;
  treinos[currentDay][index].icon = iconBySectionName(value);
  saveData();
  render();
}

function renderTabs(){
  const area = document.getElementById("dayTabs");
  area.innerHTML = "";
  dias.forEach(d=>{
    const btn = document.createElement("div");
    btn.className = "day-tab" + (d === currentDay ? " active" : "");
    btn.innerText = d;
    btn.onclick = () => {
      currentDay = d;
      renderTabs();
      render();
    };
    area.appendChild(btn);
  });
}

function toggleEdit(){
  editMode = !editMode;
  document.getElementById("editBtn").className = editMode ? "round-btn save-btn" : "round-btn edit-btn";
  document.getElementById("editBtn").innerHTML = editMode ? "💾" : "⚡";
  document.getElementById("modeText").innerText = editMode ? "edição" : "visualização";
  if(!editMode) saveData();
  render();
}

function render(){
  const area = document.getElementById("content");
  area.innerHTML = "";
  const sections = treinos[currentDay];

  if(!sections.length && !editMode){
    area.innerHTML = '<div class="empty">Nenhum treino cadastrado para este dia.</div>';
    return;
  }

  sections.forEach((section, sIndex)=>{
    if(editMode){
      area.innerHTML += renderEditSection(section, sIndex);
    }else{
      area.innerHTML += renderViewSection(section, sIndex);
    }
  });

  if(editMode){
    area.innerHTML += '<button class="add-btn add-section-btn" onclick="addSection()">+ adicionar seção</button>';
  }

  saveData();
}

function renderViewSection(section, sIndex){
  let html = `
  <section class="section">
    <div class="section-head">
      <div class="section-title">
        <span class="section-icon">${escapeHtml(iconBySectionName(section.title))}</span>
        <span>${escapeHtml(section.title)}</span>
      </div>
      <div class="time-pill">${escapeHtml(section.time || "0")} min</div>
    </div>`;

  if(!section.exercises.length){
    html += '<div class="empty">Nenhum exercício cadastrado.</div>';
  }

  section.exercises.forEach(ex=>{
    const embed = youtubeEmbed(ex.youtube);
    html += `
      <div class="exercise-view">
        <div class="exercise-main">
          <div class="exercise-left">
            <div class="exercise-icon">${escapeHtml(ex.icon || "🏃")}</div>
            <div>
              <div class="exercise-name">${escapeHtml(ex.name)}</div>
              <div class="exercise-info">${escapeHtml(ex.info)}</div>
            </div>
          </div>
          <div class="arrow">→</div>
        </div>
        <div class="metrics">
          <div class="metric"><small>Séries</small><strong>${escapeHtml(ex.series || "–")}</strong></div>
          <div class="metric"><small>Repetições</small><strong>${escapeHtml(ex.reps || "–")}</strong></div>
          <div class="metric"><small>Carga</small><strong>${escapeHtml(ex.carga || "–")}</strong></div>
          <div class="metric"><small>Descanso</small><strong>${escapeHtml(ex.descanso || "–")}</strong></div>
        </div>
      </div>
      ${embed ? `<iframe class="youtube" src="${embed}" allowfullscreen></iframe>` : ""}
    `;
  });

  html += '</section>';
  return html;
}

function renderEditSection(section, sIndex){
  let html = `
  <div class="edit-section">
    <div class="edit-grid">
      <input value="${escapeHtml(section.icon || "")}" oninput="updateSection(${sIndex}, 'icon', this.value)" placeholder="Ícone">
      <select onchange="updateSectionType(${sIndex}, this.value)">
        ${sectionOptions(section.title)}
      </select>
      <input value="${escapeHtml(section.time || "")}" oninput="updateSection(${sIndex}, 'time', this.value)" placeholder="Min">
      <button class="del" onclick="removeSection(${sIndex})">×</button>
    </div>`;

  section.exercises.forEach((ex, eIndex)=>{
    html += `
    <div class="exercise-edit-row">
      <input value="${escapeHtml(ex.icon || "")}" oninput="updateExercise(${sIndex},${eIndex},'icon',this.value)" placeholder="Ícone">
      <input value="${escapeHtml(ex.name || "")}" oninput="updateExercise(${sIndex},${eIndex},'name',this.value)" placeholder="Exercício">
      <textarea oninput="updateExercise(${sIndex},${eIndex},'info',this.value)" placeholder="Descrição">${escapeHtml(ex.info || "")}</textarea>
      <input value="${escapeHtml(ex.series || "")}" oninput="updateExercise(${sIndex},${eIndex},'series',this.value)" placeholder="Séries">
      <input value="${escapeHtml(ex.reps || "")}" oninput="updateExercise(${sIndex},${eIndex},'reps',this.value)" placeholder="Repetições">
      <input value="${escapeHtml(ex.carga || "")}" oninput="updateExercise(${sIndex},${eIndex},'carga',this.value)" placeholder="Carga">
      <input value="${escapeHtml(ex.descanso || "")}" oninput="updateExercise(${sIndex},${eIndex},'descanso',this.value)" placeholder="Descanso">
      <button class="del" onclick="removeExercise(${sIndex},${eIndex})">×</button>
    </div>
    <div style="margin-top:12px">
      <input value="${escapeHtml(ex.youtube || "")}" oninput="updateExercise(${sIndex},${eIndex},'youtube',this.value)" placeholder="URL do YouTube">
    </div>`;
  });

  html += `<button class="add-btn" onclick="addExercise(${sIndex})">+ adicionar exercício</button></div>`;
  return html;
}

function updateSection(index, key, value){
  treinos[currentDay][index][key] = value;
  saveData();
}

function updateExercise(sIndex, eIndex, key, value){
  treinos[currentDay][sIndex].exercises[eIndex][key] = value;
  saveData();
}

function addSection(){
  treinos[currentDay].push({
    title:"Aquecimento",
    icon:iconBySectionName("Aquecimento"),
    time:"10",
    exercises:[]
  });
  render();
}

function removeSection(index){
  treinos[currentDay].splice(index, 1);
  render();
}

function addExercise(sIndex){
  treinos[currentDay][sIndex].exercises.push({
    icon:"🏃",
    name:"Novo exercício",
    info:"",
    series:"",
    reps:"",
    carga:"",
    descanso:"",
    youtube:""
  });
  render();
}

function removeExercise(sIndex, eIndex){
  treinos[currentDay][sIndex].exercises.splice(eIndex, 1);
  render();
}

renderTabs();
render();
</script>
</body>
</html>
